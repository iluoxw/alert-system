name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        # internal/store 的 testcontainers 用例带 //go:build integration 标签，
        # 必须 -tags=integration 才会编译进来（裸跑 ./... 会静默跳过 store，
        # 曾导致 CI「全绿」实际零覆盖 store）；test/e2e 无标签，其 TestMain
        # 自行 docker compose up/down 一套真实 PG，ubuntu-latest runner 自带
        # docker 与 compose v2，无需额外安装。
        timeout-minutes: 20
        run: go test -tags=integration ./... -race -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: npm run build
        working-directory: web
        run: npm run build

      - name: oxlint
        working-directory: web
        run: npx oxlint
