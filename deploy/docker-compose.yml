# 本地开发用 Postgres（与 test/e2e/docker-compose.yml 各自独立演进，互不复用）：
# 本文件用命名卷持久化数据，供本地长期联调；e2e 用 tmpfs，每次跑完即弃。
#
# initdb 脚本（deploy/initdb/apply-migrations.sh）只在**首次创建命名卷**时执行一次，
# 按文件名顺序跑 /migrations/*.up.sql。之后新增迁移文件不会被自动应用，需要：
#   - 手动 psql 连进容器执行新增的 *.up.sql，或
#   - docker compose -f deploy/docker-compose.yml down -v 删卷后重新 up 让 initdb 重跑
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up -d --wait
#   docker compose -f deploy/docker-compose.yml down        # 保留数据卷
#   docker compose -f deploy/docker-compose.yml down -v     # 连数据卷一起删
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alert_system
      POSTGRES_PASSWORD: alert_system
      POSTGRES_DB: alert_system
    ports:
      # 宿主机 5432 已被其他项目的 OrbStack dev-postgres 占用，本项目固定用 5433。
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 只读挂载真实迁移目录：initdb 脚本从这里按文件名顺序读取 *.up.sql 执行，
      # 不复制、不改动 migrations/ 下的任何文件。
      - ../migrations:/migrations:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alert_system -d alert_system"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
