apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sre-control
resources:
  - ../../base
  - postgres.yaml
  - secret.yaml
patches:
  - target:
      kind: ConfigMap
      name: sre-control-config
    patch: |-
      - op: replace
        path: /data/SESSION_COOKIE_SECURE
        value: "false"
images:
  - name: sre-control-api
    newName: sre-control-api
    newTag: 0.1.0
  - name: sre-control-web
    newName: sre-control-web
    newTag: 0.1.0
  - name: sre-control-migrate
    newName: sre-control-migrate
    newTag: 0.1.0
