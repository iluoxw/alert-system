# 示例文件不在 kustomization resources 中。生产环境请使用 External Secrets、Sealed
# Secrets 或平台 Secret 管理能力创建同名 Secret，禁止提交真实值。
apiVersion: v1
kind: Secret
metadata:
  name: sre-control-secrets
  namespace: sre-control
type: Opaque
stringData:
  DB_DSN: "postgres://USER:PASSWORD@POSTGRES_HOST:5432/alert_system?sslmode=require"
  LARK_APP_ID: ""
  LARK_APP_SECRET: ""
  LARK_VERIFICATION_TOKEN: ""
  LARK_ENCRYPT_KEY: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
