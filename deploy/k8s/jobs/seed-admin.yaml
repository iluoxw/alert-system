apiVersion: batch/v1
kind: Job
metadata:
  name: sre-control-seed-admin
  namespace: sre-control
  labels:
    app.kubernetes.io/name: sre-control
    app.kubernetes.io/component: bootstrap
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-control
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed-admin
          image: sre-control-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              exec /app/seed-admin
              -password "$ADMIN_PASSWORD"
              -username "${ADMIN_USERNAME:-admin}"
              -team "${ADMIN_TEAM:-default}"
          envFrom:
            - secretRef:
                name: sre-control-secrets
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
