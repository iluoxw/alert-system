apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-control
  labels:
    app.kubernetes.io/name: sre-control
    app.kubernetes.io/component: application
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sre-control
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-control
        app.kubernetes.io/component: application
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: sre-control-migrate:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -path=/migrations
            - -database=$(DB_DSN)
            - up
          envFrom:
            - secretRef:
                name: sre-control-secrets
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      containers:
        - name: api
          image: sre-control-api:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sre-control-config
            - secretRef:
                name: sre-control-secrets
          ports:
            - name: api
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: api-tmp
              mountPath: /tmp
        - name: web
          image: sre-control-web:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: web-tmp
              mountPath: /tmp
      volumes:
        - name: api-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: web-tmp
          emptyDir:
            sizeLimit: 64Mi
